name: End-to-End Infrastructure & App Deployment

on:
  push:
    branches: [ master ]

jobs:
  # STEP 1: Code Linting and Safety Verification
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Syntax Checks
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # STEP 2: Terraform Infrastructure Provisioning
  infrastructure:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.get_ip.outputs.vps_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        env:
          # Satisfies the interactive prompt roadblock
          TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }} 
          # PROVIDES SECURITY ACCESS KEYS TO AWS NATIVELY
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/ 
          terraform init
          terraform apply -auto-approve
          
      - name: Extract VPS Public IP
        id: get_ip
        run: |
          cd terraform-ec2/
          # NATIVE FIX: Run standard terraform output directly to bypass wrapper limitations
          echo "vps_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
  # STEP 3: Automated Docker Build
  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Set up QEMU for ARM emulation capability
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Set up Docker Buildx (CRITICAL: This switches the driver to 'docker-container')
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Securely authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Compile and Push Multi-Arch Container Image
      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # Now this driver will accept both architectures easily!
          tags: ${{ secrets.DOCKER_USERNAME }}/marzban:latest

  # STEP 4: Automated Remote Server Initialization, DuckDNS Update, SSL Generation, and App Spin-up
  deploy-and-secure:
    needs: [infrastructure, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automated Bootstrapping via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ secrets.DOMAIN }}
          APP_EMAIL: ${{ secrets.EMAIL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }} 
          VPS_IP: ${{ needs.infrastructure.outputs.vps_ip }}
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu # Updated to ubuntu for AWS AMI compatibility
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DOMAIN,APP_EMAIL,DOCKER_USER,DUCK_TOKEN,VPS_IP
          script: |
            # 1. Update DuckDNS to point to our newly provisioned AWS Public IP
            SUBDOMAIN=$(echo $APP_DOMAIN | cut -d'.' -f1)
            echo "Updating DuckDNS record for $SUBDOMAIN to point to $VPS_IP..."
            curl -s "https://www.duckdns.org/update?domains=$SUBDOMAIN&token=$DUCK_TOKEN&ip=$VPS_IP"
            
            # Give global DNS routers 15 seconds to sync paths
            sleep 15

            # 2. Create clean production directory layout
            mkdir -p /opt/marzban-production/nginx/conf.d
            cd /opt/marzban-production

            # 3. Write dynamic, automated Nginx bootstrap config
            cat << EOF > nginx/conf.d/marzban.conf
            server {
                listen 80;
                server_name $APP_DOMAIN;
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
            }
            EOF

            # 4. Write out a dynamic docker-compose execution stack
            cat << EOF > docker-compose.yml
            version: '3.8'
            services:
              marzban:
                image: $DOCKER_USER/marzban:latest
                restart: always
                ports:
                  - "8000:8000"
                volumes:
                  - /var/lib/marzban:/var/lib/marzban

              nginx:
                image: nginx:alpine
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/conf.d:/etc/nginx/conf.d
                  - /etc/letsencrypt:/etc/letsencrypt
                  - /var/www/certbot:/var/www/certbot

              certbot:
                image: certbot/certbot
                volumes:
                  - /etc/letsencrypt:/etc/letsencrypt
                  - /var/www/certbot:/var/www/certbot
                entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait \$\${!}; done;'"
            EOF

            # 5. Spin up HTTP Nginx validation instance
            docker compose up -d nginx
            sleep 5

            # 6. Automate Certificate Request Injection
            docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/www/certbot:/var/www/certbot \
              certbot/certbot certonly --webroot \
              --webroot-path=/var/www/certbot \
              -d $APP_DOMAIN --email $APP_EMAIL --agree-tos --no-eff-email --non-interactive

            # 7. Overwrite Bootstrap config with the full Production HTTPS Reverse Proxy layout
            cat << EOF > nginx/conf.d/marzban.conf
            server {
                listen 80;
                server_name $APP_DOMAIN;
                return 301 https://\$host\$request_uri;
            }
            server {
                listen 443 ssl http2;
                server_name $APP_DOMAIN;
                ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;
                
                location / {
                    proxy_pass http://marzban:8000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                }
            }
            EOF

            # 8. Start everything and restart Nginx to hook into the new SSL certificates
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose restart nginx












