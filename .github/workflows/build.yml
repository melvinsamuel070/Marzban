name: End-to-End Infrastructure & App Deployment

on:
  push:
    branches: [ master ]

jobs:
  # STEP 1: Code Linting and Safety Verification
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Syntax Checks
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # STEP 2: Terraform Infrastructure Provisioning
  infrastructure:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.get_ip.outputs.vps_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        env:
          TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
          TF_VAR_instance_name: "marzban-production-server"
          TF_VAR_instance_type: "t3.medium"

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          terraform init
          terraform apply -auto-approve

      - name: Extract VPS Public IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          echo "vps_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

  # STEP 3: Automated Docker Build
  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/marzban:latest

  # STEP 4: Deployment + DuckDNS + SSL + App Bootstrapping
  deploy-and-secure:
    needs: [infrastructure, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automated Bootstrapping via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ secrets.DOMAIN }}
          APP_EMAIL: ${{ secrets.EMAIL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          VPS_IP: ${{ needs.infrastructure.outputs.vps_ip }}
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DOMAIN,APP_EMAIL,DOCKER_USER,DUCK_TOKEN,VPS_IP
          script: |
            set -e

            # 1. Update DuckDNS
            SUBDOMAIN=$(echo $APP_DOMAIN | cut -d'.' -f1)

            echo "Updating DuckDNS..."
            curl -fsS "https://www.duckdns.org/update?domains=$SUBDOMAIN&token=$DUCK_TOKEN&ip=$VPS_IP"

            # 2. WAIT FOR REAL DNS PROPAGATION
            echo "Waiting for DNS propagation..."
            for i in {1..30}; do
              CURRENT_IP=$(nslookup $APP_DOMAIN | awk '/Address: / {print $2}' | tail -n1)
              echo "DNS resolved to: $CURRENT_IP"

              if [ "$CURRENT_IP" = "$VPS_IP" ]; then
                echo "DNS is correct ✔"
                break
              fi
              sleep 10
            done

            # 3. Install Docker if missing
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg dnsutils
              sudo install -m 0755 -d /etc/apt/keyrings

              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg

              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # 4. Setup production workspace paths safely
            sudo mkdir -p /opt/marzban-production/nginx/conf.d
            sudo mkdir -p /etc/letsencrypt/live/$APP_DOMAIN
            sudo mkdir -p /etc/letsencrypt/archive/$APP_DOMAIN
            sudo mkdir -p /var/www/certbot
            
            sudo chown -R ubuntu:ubuntu /opt/marzban-production
            sudo chown -R ubuntu:ubuntu /etc/letsencrypt
            sudo chown -R ubuntu:ubuntu /var/www/certbot
            cd /opt/marzban-production

            # 5. Check and seed temporary certificates to safeguard Nginx parsed runs
            CERT_DIR="/etc/letsencrypt/live/$APP_DOMAIN"
            ARCHIVE_DIR="/etc/letsencrypt/archive/$APP_DOMAIN"

            if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
                echo "⚠️ Real SSL certificates not found. Creating temporary mock certificates..."
                openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                    -keyout "$ARCHIVE_DIR/privkey.pem" \
                    -out "$ARCHIVE_DIR/fullchain.pem" \
                    -subj "/CN=localhost"
                    
                ln -sf "$ARCHIVE_DIR/fullchain.pem" "$CERT_DIR/fullchain.pem"
                ln -sf "$ARCHIVE_DIR/privkey.pem" "$CERT_DIR/privkey.pem"
            fi

            # 6. Build production-grade configuration definitions (HTTPS-ready from step one)
            cat << EOF > nginx/conf.d/marzban.conf
            server {
                listen 80;
                server_name $APP_DOMAIN;
                
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }

                location / {
                    return 301 https://\$host\$request_uri;
                }
            }

            server {
                listen 443 ssl;
                http2 on;
                server_name $APP_DOMAIN;

                ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;

                location / {
                    proxy_pass http://marzban:8000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                }
            }
            EOF

            # 7. Write production-hardened isolated network compose stack
            cat << EOF > docker-compose.yml
            services:
              marzban:
                image: $DOCKER_USER/marzban:latest
                restart: always
                expose:
                  - "8000"
                networks:
                  - marzban-net
                environment:
                  UVICORN_HOST: "0.0.0.0"
                  UVICORN_PORT: 8000

              nginx:
                image: nginx:alpine
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/conf.d:/etc/nginx/conf.d
                  - /etc/letsencrypt:/etc/letsencrypt
                  - /var/www/certbot:/var/www/certbot
                networks:
                  - marzban-net

              certbot:
                image: certbot/certbot
                volumes:
                  - /etc/letsencrypt:/etc/letsencrypt
                  - /var/www/certbot:/var/www/certbot
                networks:
                  - marzban-net
                entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait \$\${!}; done;'"

            networks:
              marzban-net:
                driver: bridge
            EOF

            # 8. Spin up core architecture cleanly with the placeholder files
            echo "🚀 Launching core container ecosystem..."
            sudo docker compose pull
            sudo docker compose up -d marzban nginx --remove-orphans
            sleep 5

            # 9. Dispatch Certbot to issue real certificates via active port 80 proxy routes
            echo "🔒 Requesting real Let's Encrypt validation keys..."
            sudo docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/www/certbot:/var/www/certbot \
              certbot/certbot certonly --webroot \
              --webroot-path=/var/www/certbot \
              -d $APP_DOMAIN \
              --email $APP_EMAIL \
              --agree-tos \
              --no-eff-email \
              --non-interactive

            # 10. Seamlessly hot-reload Nginx configuration with valid signatures
            echo "🔄 Swapping mock elements for live authenticated lines..."
            sudo docker compose exec -T nginx nginx -s reload

            # 11. Run background tasks setup complete synchronization
            sudo docker compose up -d --remove-orphans
            echo "====== Pipeline Processing Cycle Completed Successfully ======"