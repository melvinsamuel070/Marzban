name: End-to-End Infrastructure & App Deployment

on:
  push:
    branches: [ master ]

jobs:
  # STEP 1: Code Linting and Safety Verification
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Syntax Checks
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


  # STEP 2: Infrastructure Provisioning (Terraform)
  infrastructure:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.get_ip.outputs.vps_ip }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        env:
          TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
          TF_VAR_instance_name: "marzban-production-server"
          TF_VAR_instance_type: "t3.medium"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          terraform init
          terraform apply -auto-approve

      - name: Extract VPS Public IP
        id: get_ip
        run: |
          cd terraform-ec2/
          VPS_IP=$(terraform output -raw public_ip)
          echo "vps_ip=$VPS_IP" >> $GITHUB_OUTPUT

          # 🔥 HARD FAIL IF EMPTY (fixes dial tcp :0)
          if [ -z "$VPS_IP" ]; then
            echo "ERROR: Terraform did not return VPS IP"
            exit 1
          fi

          echo "VPS IP = $VPS_IP"


  # STEP 3: Docker Image Build
  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/marzban:latest


  # STEP 4: Deployment + SSL + App Bootstrapping
  deploy-and-secure:
    needs: [infrastructure, build-image]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Prepare directory
      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/marzban-production
            sudo chown -R ubuntu:ubuntu /opt/marzban-production


      # Copy configs
      - name: Copy Docker + Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/conf.d/marzban.conf"
          target: "/opt/marzban-production/"


      # Deploy
      - name: Deploy Application + SSL
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ secrets.DOMAIN }}
          APP_EMAIL: ${{ secrets.EMAIL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          VPS_IP: ${{ needs.infrastructure.outputs.vps_ip }}
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DOMAIN,APP_EMAIL,DOCKER_USER,DUCK_TOKEN,VPS_IP
          script: |
            set -e

            echo "VPS IP: $VPS_IP"

            # 1. Update DuckDNS
            SUBDOMAIN=$(echo $APP_DOMAIN | cut -d'.' -f1)
            curl -fsS "https://www.duckdns.org/update?domains=$SUBDOMAIN&token=$DUCK_TOKEN&ip=$VPS_IP"

            # 2. Wait for DNS
            echo "Waiting for DNS..."
            sleep 30

            # 3. Install Docker if missing
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg dnsutils
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture)] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi

            # 4. Setup directories
            sudo mkdir -p /var/www/certbot
            sudo mkdir -p /etc/letsencrypt
            sudo chown -R ubuntu:ubuntu /opt/marzban-production

            cd /opt/marzban-production

            # 5. Inject domain into HTTP bootstrap config
            sed "s|placeholder|$APP_DOMAIN|g" \
              nginx/conf.d/marzban.conf \
              > nginx/conf.d/default.conf

            # 6. Start nginx
            sudo docker compose up -d nginx

            echo "Waiting for nginx..."
            sleep 20

            # 7. Request SSL certificate
            sudo docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/www/certbot:/var/www/certbot \
              certbot/certbot certonly \
              --webroot \
              -w /var/www/certbot \
              -d $APP_DOMAIN \
              --email $APP_EMAIL \
              --agree-tos \
              --no-eff-email \
              --non-interactive \
              --keep-until-expiring

            # 8. Switch to HTTPS config
            sed "s|placeholder|$APP_DOMAIN|g" \
              nginx/conf.d/marzban.conf \
              > nginx/conf.d/default.conf

            # 9. Start full stack
            sudo docker compose up -d --force-recreate marzban nginx
            sudo docker compose exec -T nginx nginx -s reload

            echo "====== DEPLOYMENT COMPLETE ======"