name: End-to-End Infrastructure & App Deployment

on:
  push:
    branches: [ master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Syntax Checks
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  infrastructure:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.get_ip.outputs.vps_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        env:
          TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
          TF_VAR_instance_name: "marzban-production-server"
          TF_VAR_instance_type: "t3.medium"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          terraform init
          terraform apply -auto-approve

      - name: Extract VPS Public IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          echo "vps_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/marzban:latest

  deploy-and-secure:
    needs: [infrastructure, build-image]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-configure target directory permissions via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/marzban-production
            sudo chown -R ubuntu:ubuntu /opt/marzban-production

      - name: Copy Stack Configurations to Target Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/conf.d/default.conf"
          target: "/opt/marzban-production/"
          overwrite: true

      - name: Automated Bootstrapping via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ secrets.DOMAIN }}
          APP_EMAIL: ${{ secrets.EMAIL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          VPS_IP: ${{ needs.infrastructure.outputs.vps_ip }}

        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DOMAIN,APP_EMAIL,DOCKER_USER,DUCK_TOKEN,VPS_IP

          script: |
            set -e

            echo "🧨 HARD CLEAN DOCKER ENV (fix port 80 leaks)"
            sudo docker stop $(sudo docker ps -q) 2>/dev/null || true
            sudo docker rm $(sudo docker ps -aq) 2>/dev/null || true
            sudo docker network prune -f || true
            sudo systemctl restart docker
            sleep 5

            echo "Updating DuckDNS..."
            SUBDOMAIN=$(echo $APP_DOMAIN | cut -d'.' -f1)
            curl -fsS "https://www.duckdns.org/update?domains=$SUBDOMAIN&token=$DUCK_TOKEN&ip=$VPS_IP"

            echo "Waiting for DNS propagation..."
            DNS_OK=false

            for i in {1..30}; do
              DNS1=$(dig @1.1.1.1 +short $APP_DOMAIN | head -n1)
              DNS2=$(dig @8.8.8.8 +short $APP_DOMAIN | head -n1)
              DNS3=$(dig @9.9.9.9 +short $APP_DOMAIN | head -n1)

              echo "Attempt $i/30"
              echo "CF: $DNS1 | Google: $DNS2 | Quad9: $DNS3"

              if [ "$DNS1" = "$VPS_IP" ] && [ "$DNS2" = "$VPS_IP" ] && [ "$DNS3" = "$VPS_IP" ]; then
                echo "DNS stabilized"
                DNS_OK=true
                break
              fi

              sleep 15
            done

            if [ "$DNS_OK" = false ]; then
              echo "❌ DNS not ready"
              exit 1
            fi

            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg dnsutils
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture)] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            echo "📦 Preparing deployment"
            sudo mkdir -p /opt/marzban-production/nginx/conf.d
            sudo mkdir -p /opt/marzban-production/data
            sudo mkdir -p /etc/letsencrypt
            sudo mkdir -p /var/www/certbot/.well-known/acme-challenge
            sudo mkdir -p /var/lib/letsencrypt

            sudo chown -R ubuntu:ubuntu /opt/marzban-production
            cd /opt/marzban-production

            cat << EOF > .env
            DOCKER_USER=${DOCKER_USER}
            UVICORN_UDS="/var/lib/marzban/marzban.sock"
            XRAY_JSON="/var/lib/marzban/xray_config.json"
            SQLALCHEMY_DATABASE_URL="sqlite:////var/lib/marzban/db.sqlite3"
            EOF

            sed -i "s|placeholder|$APP_DOMAIN|g" nginx/conf.d/default.conf
            sudo chmod -R 777 ./data

            echo "Bootstrap nginx..."
            cat << 'EOF' > nginx/conf.d/default.conf.bootstrap
            server {
                listen 80;
                server_name _;
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
            }
            EOF

            mv nginx/conf.d/default.conf nginx/conf.d/default.conf.backup
            mv nginx/conf.d/default.conf.bootstrap nginx/conf.d/default.conf

            sudo docker compose up -d nginx
            sleep 5

            echo "Requesting SSL..."
            sudo docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/www/certbot:/var/www/certbot \
              certbot/certbot certonly --webroot \
              --webroot-path=/var/www/certbot \
              -d $APP_DOMAIN \
              --email $APP_EMAIL \
              --agree-tos \
              --no-eff-email \
              --non-interactive

            mv nginx/conf.d/default.conf.backup nginx/conf.d/default.conf

            CERT="/etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem"
            if [ ! -f "$CERT" ]; then
              echo "❌ SSL failed"
              exit 1
            fi

            echo "🚀 Starting full stack..."
            sudo docker compose down
            sudo docker compose up -d --force-recreate --remove-orphans

            echo "✅ Setup complete: https://$APP_DOMAIN/dashboard/"






















































































