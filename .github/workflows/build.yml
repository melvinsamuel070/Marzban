name: End-to-End Infrastructure & App Deployment

on:
  push:
    branches: [ master ]

jobs:
  # STEP 1: Code Linting and Safety Verification
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Syntax Checks
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # STEP 2: Terraform Infrastructure Provisioning
  infrastructure:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.get_ip.outputs.vps_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        env:
          TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
          TF_VAR_instance_name: "marzban-production-server"
          TF_VAR_instance_type: "t3.medium"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          terraform init
          terraform apply -auto-approve

      - name: Extract VPS Public IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform-ec2/
          echo "vps_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

  # STEP 3: Automated Docker Build
  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/marzban:latest

  # STEP 4: Deployment + DuckDNS + SSL + App Bootstrapping
  deploy-and-secure:
    needs: [infrastructure, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-configure target directory permissions via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo mkdir -p /opt/marzban-production
            sudo chown -R ubuntu:ubuntu /opt/marzban-production

      - name: Copy Stack Configurations to Target Host (Compose & Nginx)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/conf.d/marzban.conf"
          target: "/opt/marzban-production/"
          overwrite: true

      - name: Automated Bootstrapping via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ secrets.DOMAIN }}
          APP_EMAIL: ${{ secrets.EMAIL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          VPS_IP: ${{ needs.infrastructure.outputs.vps_ip }}
        with:
          host: ${{ needs.infrastructure.outputs.vps_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DOMAIN,APP_EMAIL,DOCKER_USER,DUCK_TOKEN,VPS_IP
          script: |
            set -e

            # 1. Update DuckDNS
            SUBDOMAIN=$(echo $APP_DOMAIN | cut -d'.' -f1)
            echo "Updating DuckDNS..."
            curl -fsS "https://www.duckdns.org/update?domains=$SUBDOMAIN&token=$DUCK_TOKEN&ip=$VPS_IP"

            # 2. WAIT FOR REAL DNS PROPAGATION
            echo "Waiting for DNS propagation..."
            DNS_CORRECT=false
            for i in {1..60}; do
              CURRENT_IP=$(dig +short $APP_DOMAIN | head -n1)
              echo "Attempt $i/60 - DNS resolved to: ${CURRENT_IP:-'Not resolved yet'}"
              if [ "$CURRENT_IP" = "$VPS_IP" ]; then
                echo "✅ DNS is correct"
                DNS_CORRECT=true
                break
              fi
              sleep 10
            done

            if [ "$DNS_CORRECT" = false ]; then
              echo "❌ DNS propagation failed after 10 minutes. Exiting..."
              exit 1
            fi

            # 3. Install Docker if missing
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg dnsutils
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # 4. Setup production workspace paths
            sudo mkdir -p /opt/marzban-production/nginx/conf.d
            sudo mkdir -p /etc/letsencrypt
            sudo mkdir -p /var/www/certbot
            sudo mkdir -p /var/lib/letsencrypt
            
            sudo chown -R ubuntu:ubuntu /opt/marzban-production
            sudo chown -R ubuntu:ubuntu /etc/letsencrypt
            sudo chown -R ubuntu:ubuntu /var/www/certbot
            sudo chown -R ubuntu:ubuntu /var/lib/letsencrypt
            cd /opt/marzban-production

            # 5. Populate remote environment variables configuration file (.env)
            echo "DOCKER_USER=${DOCKER_USER}" > .env

            # 6. Inject dynamic application domain references directly into the tracked config
            sed -i "s|placeholder|$APP_DOMAIN|g" nginx/conf.d/marzban.conf

            # 7. Check if valid certificate exists
            echo "Checking for existing valid certificate..."
            CERT_VALID=false
            if sudo docker run --rm -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot certificates 2>/dev/null | grep -q "$APP_DOMAIN.*VALID"; then
              echo "✅ Valid certificate already exists, skipping issuance"
              CERT_VALID=true
            else
              echo "⚠️ No valid certificate found, will request new one"
            fi

            # 8. Start HTTP version first to ensure service is accessible
            echo "Starting HTTP version temporarily..."
            cp nginx/conf.d/marzban.conf nginx/conf.d/marzban.conf.ssl-backup
            sed -i 's/listen 443 ssl;/listen 80;/g' nginx/conf.d/marzban.conf
            sed -i 's/ssl_certificate.*/# &/g' nginx/conf.d/marzban.conf
            sed -i 's/ssl_certificate_key.*/# &/g' nginx/conf.d/marzban.conf
            
            echo "Pulling latest docker container images quietly..."
            sudo docker compose pull --quiet
            
            echo "Bootstrapping core containers..."
            sudo docker compose up -d --force-recreate --remove-orphans
            sleep 10

            # 9. Request certificates if needed
            if [ "$CERT_VALID" = false ]; then
              echo "Requesting Let's Encrypt certificates..."
              
              # Stop nginx for standalone mode (more reliable)
              sudo docker compose stop nginx
              
              # Try with retry logic for rate limits
              MAX_RETRIES=3
              RETRY_COUNT=0
              CERT_SUCCESS=false
              
              while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$CERT_SUCCESS" = false ]; do
                if sudo docker run --rm \
                  -v /etc/letsencrypt:/etc/letsencrypt \
                  -v /var/lib/letsencrypt:/var/lib/letsencrypt \
                  certbot/certbot certonly --standalone \
                  -d $APP_DOMAIN \
                  --email $APP_EMAIL \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  --keep-until-expiring; then
                  CERT_SUCCESS=true
                  echo "✅ Certificates obtained successfully"
                else
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "⚠️ Certificate request failed (attempt $RETRY_COUNT/$MAX_RETRIES), waiting 60 seconds..."
                    sleep 60
                  fi
                fi
              done
              
              # If still failed, use staging or HTTP fallback
              if [ "$CERT_SUCCESS" = false ]; then
                echo "⚠️ Production certificate failed, trying staging environment..."
                if sudo docker run --rm \
                  -v /etc/letsencrypt:/etc/letsencrypt \
                  -v /var/lib/letsencrypt:/var/lib/letsencrypt \
                  certbot/certbot certonly --standalone \
                  -d $APP_DOMAIN \
                  --email $APP_EMAIL \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  --staging; then
                  echo "✅ Staging certificates obtained (for testing)"
                  CERT_SUCCESS=true
                else
                  echo "⚠️ Continuing with HTTP only mode"
                fi
              fi
            else
              CERT_SUCCESS=true
            fi

            # 10. Restore SSL configuration if certificates exist
            if [ "$CERT_SUCCESS" = true ] && [ -f "/etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem" ]; then
              echo "Restoring SSL configuration..."
              mv nginx/conf.d/marzban.conf.ssl-backup nginx/conf.d/marzban.conf
              
              # Verify certificate paths
              echo "Verifying certificate paths..."
              sudo ls -la /etc/letsencrypt/live/$APP_DOMAIN/
              
              echo "Starting full stack with SSL..."
              sudo docker compose up -d --force-recreate --remove-orphans
              sleep 10
              
              # Test SSL
              echo "Testing SSL configuration..."
              sudo docker run --rm \
                --network container:marzban-production-nginx-1 \
                curlimages/curl:latest curl -s -k -o /dev/null -w "%{http_code}\n" \
                https://localhost || echo "⚠️ SSL test warning"
              
              # Setup auto-renewal
              echo "Setting up automatic certificate renewal..."
              (sudo crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 3 * * * docker run --rm -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot renew --quiet && sudo docker compose exec -T nginx nginx -s reload") | sudo crontab -
            else
              echo "⚠️ Running in HTTP mode (certificates unavailable)"
              echo "To switch to HTTPS later, run:"
              echo "  cd /opt/marzban-production"
              echo "  sudo docker compose stop nginx"
              echo "  sudo docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/lib/letsencrypt:/var/lib/letsencrypt certbot/certbot certonly --standalone -d $APP_DOMAIN --email $APP_EMAIL --agree-tos --no-eff-email --non-interactive"
              echo "  sudo docker compose up -d --force-recreate"
            fi
            
            # Final health check
            echo "Performing final health check..."
            HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
            if [ "$HEALTH_CHECK" = "200" ] || [ "$HEALTH_CHECK" = "302" ]; then
              echo "✅ Service is healthy (HTTP $HEALTH_CHECK)"
            else
              echo "⚠️ Health check returned: $HEALTH_CHECK"
              echo "Checking container logs..."
              sudo docker compose logs --tail=50
            fi
            
            echo "====== Pipeline Processing Cycle Completed Successfully ======"
            if [ -f "/etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem" ]; then
              echo "✅ Marzban is available at: https://$APP_DOMAIN"
            else
              echo "✅ Marzban is available at: http://$APP_DOMAIN"
              echo "⚠️ Note: Running in HTTP mode. SSL will be enabled on next successful certificate request."
            fi


















