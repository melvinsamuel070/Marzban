version: "3.8"

services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban-production-engine
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/marzban
    expose:
      - "8000"
    networks:
      - production-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/dashboard/"]   # Marzban uses /dashboard/
      interval: 12s
      timeout: 8s
      retries: 8
      start_period: 25s

  nginx:
    image: nginx:alpine
    container_name: marzban-production-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data:/var/lib/marzban:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    networks:
      - production-net
    depends_on:
      marzban:
        condition: service_healthy

networks:
  production-net:
    driver: bridge