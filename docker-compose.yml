version: "3.8"

services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban-production-engine
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/marzban
      - /var/run:/var/run  # Add this for socket communication
    networks:
      - production-net

  nginx:
    image: nginx:alpine
    container_name: marzban-production-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./data:/var/lib/marzban
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - production-net
    depends_on:
      - marzban

networks:
  production-net:
    driver: bridge