version: "3.8"

services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban-production-engine
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/marzban
    # Expose for internal network only (no host port needed)
    expose:
      - "8000"
    networks:
      - production-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: marzban-production-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data:/var/lib/marzban:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    networks:
      - production-net
    depends_on:
      marzban:
        condition: service_healthy

networks:
  production-net:
    driver: bridge