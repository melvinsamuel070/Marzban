version: "3.8"

services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban-production-engine
    restart: always
    env_file:
      - .env
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
    volumes:
      - ./data:/var/lib/marzban
    ports:
      - "8000:8000"
    networks:
      - production-net
    healthcheck:
      disable: true

  nginx:
    image: nginx:alpine
    container_name: marzban-production-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data:/var/lib/marzban:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    networks:
      - production-net
    depends_on:
      - marzban

networks:
  production-net:
    driver: bridge