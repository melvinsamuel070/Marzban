# 1. HTTP Configuration Layer (Handles verification and strict redirection)
server {
    listen 80;
    server_name placeholder;

    # Let's Encrypt ACME Validation Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Force secure redirection for general navigation traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Core Application Layout
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name placeholder;

    # Production Let's Encrypt Volume Certificate Mappings
    ssl_certificate /etc/letsencrypt/live/placeholder/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/placeholder/privkey.pem;

    # Optimization Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # Proxy to Marzban container on port 8000
        proxy_pass http://marzban:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}